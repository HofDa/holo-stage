<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AMOC Ocean Conveyor</title>
<style>
  :root {
    --panel: rgba(8, 12, 20, 0.82);
    --line: rgba(255, 255, 255, 0.12);
    --fg: #eaf1fb;
    --muted: #8d9db5;
    --warm: #ff6a2b;
    --cold: #3cb4ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif; user-select: none; }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  canvas:active { cursor: grabbing; }
  .hud { position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column;
    justify-content: space-between; padding: 16px; }
  body.headless .hud { display: none; }
  .card { pointer-events: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px 15px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .top { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: flex-start; }
  h1 { font-size: 16px; font-weight: 650; }
  h1 span { color: var(--muted); font-weight: 500; }
  .caption { font-size: 13px; color: var(--muted); margin-top: 4px; max-width: 460px; line-height: 1.4; min-height: 2.8em; }
  .legend { display: grid; gap: 6px; font-size: 12px; color: var(--muted); }
  .legend div { display: flex; align-items: center; gap: 8px; }
  .sw { width: 22px; height: 4px; border-radius: 2px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; }
  button { appearance: none; background: rgba(255,255,255,0.07); color: var(--fg); border: 1px solid var(--line);
    border-radius: 9px; padding: 7px 12px; min-height: 34px; font: 600 12.5px/1 inherit; cursor: pointer; }
  button:hover { background: rgba(255,255,255,0.14); }
  button[aria-pressed="true"] { background: rgba(255,106,43,0.22); border-color: var(--warm); color: #ffd6c2; }
  @media (max-width: 560px) { .legend { display: none; } }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div class="hud">
  <div class="top">
    <div class="card">
      <h1>AMOC <span>· Atlantic Meridional Overturning Circulation</span></h1>
      <p class="caption" id="caption">Warm surface water flows north, cools and sinks near Greenland, and returns south in the deep ocean.</p>
    </div>
    <div class="card legend">
      <div><i class="sw" style="background:linear-gradient(90deg,#ff5a1f,#ffb070)"></i>Warm surface current</div>
      <div><i class="sw" style="background:linear-gradient(90deg,#ffd9e8,#7fc8ff)"></i>Cooling &amp; sinking</div>
      <div><i class="sw" style="background:linear-gradient(90deg,#3cb4ff,#2a6dff)"></i>Cold deep return flow</div>
      <div><i class="sw" style="background:#d8f3ff"></i>Greenland meltwater</div>
    </div>
  </div>
  <div class="card bar">
    <button data-mode="loop" aria-pressed="true">Circulation</button>
    <button data-mode="story" aria-pressed="false">Trace the loop</button>
    <button data-mode="weaken" aria-pressed="false">Slowdown</button>
    <button id="spin" aria-pressed="false">Spin 72°/s</button>
  </div>
</div>

<script>
'use strict';
// ---------------------------------------------------------------- math
const D2R = Math.PI / 180;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const ease = t => t * t * (3 - 2 * t);
function llv(lat, lon) {
  const a = lat * D2R, b = lon * D2R;
  return [Math.cos(a) * Math.sin(b), Math.sin(a), Math.cos(a) * Math.cos(b)];
}
const vadd = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const vsub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const vmul = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
const vlen = a => Math.hypot(a[0], a[1], a[2]);
const vnorm = a => vmul(a, 1 / (vlen(a) || 1));
const vcross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const vdot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];

// row-major 3x3 globe rotation: object (lat/lon) space -> world, so (lat0, lon0) faces the camera
function globeRot(lat0, lon0) {
  const y = -lon0 * D2R, x = lat0 * D2R;
  const cy = Math.cos(y), sy = Math.sin(y), cx = Math.cos(x), sx = Math.sin(x);
  const Ry = [cy, 0, sy, 0, 1, 0, -sy, 0, cy];
  const Rx = [1, 0, 0, 0, cx, -sx, 0, sx, cx];
  const m = new Array(9);
  for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++)
    m[r * 3 + c] = Rx[r * 3] * Ry[c] + Rx[r * 3 + 1] * Ry[3 + c] + Rx[r * 3 + 2] * Ry[6 + c];
  return m;
}
const colMajor3 = m => new Float32Array([m[0], m[3], m[6], m[1], m[4], m[7], m[2], m[5], m[8]]);
const mulT3 = (m, v) => [m[0] * v[0] + m[3] * v[1] + m[6] * v[2], m[1] * v[0] + m[4] * v[1] + m[7] * v[2], m[2] * v[0] + m[5] * v[1] + m[8] * v[2]];

function perspective(fovy, aspect, n, f) {
  const t = 1 / Math.tan(fovy / 2);
  return [t / aspect, 0, 0, 0, 0, t, 0, 0, 0, 0, (f + n) / (n - f), -1, 0, 0, 2 * f * n / (n - f), 0];
}
function mul4(a, b) { // column-major
  const o = new Array(16);
  for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) {
    let s = 0; for (let k = 0; k < 4; k++) s += a[k * 4 + r] * b[c * 4 + k]; o[c * 4 + r] = s;
  }
  return o;
}
function inv4(m) {
  const inv = new Array(16);
  inv[0] = m[5]*m[10]*m[15]-m[5]*m[11]*m[14]-m[9]*m[6]*m[15]+m[9]*m[7]*m[14]+m[13]*m[6]*m[11]-m[13]*m[7]*m[10];
  inv[4] = -m[4]*m[10]*m[15]+m[4]*m[11]*m[14]+m[8]*m[6]*m[15]-m[8]*m[7]*m[14]-m[12]*m[6]*m[11]+m[12]*m[7]*m[10];
  inv[8] = m[4]*m[9]*m[15]-m[4]*m[11]*m[13]-m[8]*m[5]*m[15]+m[8]*m[7]*m[13]+m[12]*m[5]*m[11]-m[12]*m[7]*m[9];
  inv[12] = -m[4]*m[9]*m[14]+m[4]*m[10]*m[13]+m[8]*m[5]*m[14]-m[8]*m[6]*m[13]-m[12]*m[5]*m[10]+m[12]*m[6]*m[9];
  inv[1] = -m[1]*m[10]*m[15]+m[1]*m[11]*m[14]+m[9]*m[2]*m[15]-m[9]*m[3]*m[14]-m[13]*m[2]*m[11]+m[13]*m[3]*m[10];
  inv[5] = m[0]*m[10]*m[15]-m[0]*m[11]*m[14]-m[8]*m[2]*m[15]+m[8]*m[3]*m[14]+m[12]*m[2]*m[11]-m[12]*m[3]*m[10];
  inv[9] = -m[0]*m[9]*m[15]+m[0]*m[11]*m[13]+m[8]*m[1]*m[15]-m[8]*m[3]*m[13]-m[12]*m[1]*m[11]+m[12]*m[3]*m[9];
  inv[13] = m[0]*m[9]*m[14]-m[0]*m[10]*m[13]-m[8]*m[1]*m[14]+m[8]*m[2]*m[13]+m[12]*m[1]*m[10]-m[12]*m[2]*m[9];
  inv[2] = m[1]*m[6]*m[15]-m[1]*m[7]*m[14]-m[5]*m[2]*m[15]+m[5]*m[3]*m[14]+m[13]*m[2]*m[7]-m[13]*m[3]*m[6];
  inv[6] = -m[0]*m[6]*m[15]+m[0]*m[7]*m[14]+m[4]*m[2]*m[15]-m[4]*m[3]*m[14]-m[12]*m[2]*m[7]+m[12]*m[3]*m[6];
  inv[10] = m[0]*m[5]*m[15]-m[0]*m[7]*m[13]-m[4]*m[1]*m[15]+m[4]*m[3]*m[13]+m[12]*m[1]*m[7]-m[12]*m[3]*m[5];
  inv[14] = -m[0]*m[5]*m[14]+m[0]*m[6]*m[13]+m[4]*m[1]*m[14]-m[4]*m[2]*m[13]-m[12]*m[1]*m[6]+m[12]*m[2]*m[5];
  inv[3] = -m[1]*m[6]*m[11]+m[1]*m[7]*m[10]+m[5]*m[2]*m[11]-m[5]*m[3]*m[10]-m[9]*m[2]*m[7]+m[9]*m[3]*m[6];
  inv[7] = m[0]*m[6]*m[11]-m[0]*m[7]*m[10]-m[4]*m[2]*m[11]+m[4]*m[3]*m[10]+m[8]*m[2]*m[7]-m[8]*m[3]*m[6];
  inv[11] = -m[0]*m[5]*m[11]+m[0]*m[7]*m[9]+m[4]*m[1]*m[11]-m[4]*m[3]*m[9]-m[8]*m[1]*m[7]+m[8]*m[3]*m[5];
  inv[15] = m[0]*m[5]*m[10]-m[0]*m[6]*m[9]-m[4]*m[1]*m[10]+m[4]*m[2]*m[9]+m[8]*m[1]*m[6]-m[8]*m[2]*m[5];
  let det = m[0] * inv[0] + m[1] * inv[4] + m[2] * inv[8] + m[3] * inv[12];
  det = 1 / det;
  return inv.map(v => v * det);
}

// ---------------------------------------------------------------- current paths
// waypoint: [lat, lon, depth (0 surface .. 1 deep), temperature (1 warm .. 0 cold), speed, key?]
const SURF_R = 1.012, DEEP_R = 0.952;
const radiusAt = d => lerp(SURF_R, DEEP_R, d);

const UPPER_SOUTH = [
  [-39, 19, 0, 0.72, 1.0, 'start'],   // Agulhas leakage off the Cape
  [-34, 8, 0, 0.78, 1.0],
  [-26, -4, 0, 0.84, 1.0],
  [-17, -18, 0, 0.9, 1.05],
  [-9, -30, 0, 0.95, 1.1],
  [-2, -40, 0, 1, 1.2],                // North Brazil Current
  [5, -49, 0, 1, 1.3],
  [11, -59, 0, 1, 1.3],
  [15, -70, 0, 1, 1.25],               // Caribbean
  [18.5, -82, 0, 1, 1.25],
  [23, -87.5, 0, 1, 1.3],              // Loop Current
  [26, -86, 0, 1, 1.4],
  [24.3, -81.5, 0, 1, 1.7],            // Florida Straits
  [27, -79.8, 0, 1, 1.9],
  [31, -79.6, 0, 1, 2.0],              // Gulf Stream
  [35, -74.8, 0, 1, 2.0],
  [38.5, -68, 0, 0.96, 1.9],
  [41, -57, 0, 0.92, 1.7],
  [44, -45, 0, 0.86, 1.5],
];
const NORDIC_ARM = [
  [48.5, -34, 0, 0.8, 1.35],           // North Atlantic Current
  [53, -24, 0, 0.73, 1.25],
  [57.5, -15, 0, 0.66, 1.2],
  [61.5, -6, 0, 0.58, 1.1],            // Faroe–Shetland
  [65.5, 1, 0, 0.5, 1.0],              // Norwegian Atlantic Current
  [70, 4, 0, 0.42, 0.9],
  [73.5, -1, 0, 0.34, 0.8, 'sink'],    // Greenland Sea convection
];
const LABRADOR_ARM = [
  [49, -38, 0, 0.76, 1.3],
  [54.5, -33, 0, 0.68, 1.2],
  [59, -32.5, 0, 0.6, 1.1],            // Irminger Current
  [62, -37, 0, 0.52, 1.0],
  [60.5, -42.5, 0, 0.46, 1.0],
  [59.6, -46.5, 0, 0.4, 1.0],          // Cape Farewell
  [62, -52.5, 0, 0.33, 0.9],           // West Greenland Current
  [60, -56.5, 0, 0.28, 0.8, 'sink'],   // Labrador Sea convection
];
const DEEP_NORDIC = [
  [72.5, -11, 1, 0, 0.55],
  [68.5, -22, 1, 0, 0.6],
  [65.6, -28, 1, 0, 0.7],              // Denmark Strait overflow
  [62.5, -35, 1, 0, 0.65],
  [59, -42, 1, 0, 0.6],
  [56.5, -48.5, 1, 0, 0.6],
];
const DEEP_SOUTH = [
  [53, -50.5, 1, 0, 0.6],              // Deep Western Boundary Current
  [47.5, -46.5, 1, 0, 0.6],
  [42.5, -55, 1, 0, 0.6],
  [38, -66, 1, 0, 0.6],
  [33, -72.5, 1, 0, 0.6],
  [26, -72.5, 1, 0, 0.6],
  [19, -63, 1, 0, 0.6],
  [12, -54, 1, 0, 0.6],
  [4, -44, 1, 0, 0.6],
  [-5, -30.5, 1, 0, 0.6],
  [-14, -32, 1, 0, 0.6],
  [-24, -37, 1, 0, 0.6],
  [-34, -44, 1, 0, 0.6],
  [-43, -45, 1, 0, 0.6],
  [-51, -35, 1, 0, 0.6],
  [-57, -20, 1, 0.05, 0.6],
  [-60.5, -6, 1, 0.08, 0.6, 'up'],     // Southern Ocean upwelling
  [-61.5, 4, 0.65, 0.16, 0.6],
  [-59, 11, 0.25, 0.3, 0.7],
  [-54.5, 17, 0, 0.45, 0.85],
  [-47, 21, 0, 0.58, 0.95],
  [-42, 21.5, 0, 0.66, 1.0],
];
// Sinking: a tightening spiral from the surface down to the deep layer
function sinkSpiral(lat, lon, t0, turns = 2.4, n = 22) {
  const pts = [];
  for (let i = 1; i <= n; i++) {
    const u = i / n, ang = u * turns * 2 * Math.PI;
    const rad = lerp(2.6, 0.5, u);
    pts.push([lat + rad * Math.sin(ang) * 0.55, lon + rad * Math.cos(ang) / Math.cos(lat * D2R) * 0.55,
      ease(u), lerp(t0, 0, u), 0.55, i === n ? 'deep' : undefined]);
  }
  return pts;
}
const LOOPS = [
  { name: 'nordic', wps: [...UPPER_SOUTH, ...NORDIC_ARM, ...sinkSpiral(74.3, -5, 0.34), ...DEEP_NORDIC, ...DEEP_SOUTH], n: 660, bright: 1 },
  { name: 'labrador', wps: [...UPPER_SOUTH, ...LABRADOR_ARM, ...sinkSpiral(58, -54, 0.28), ...DEEP_SOUTH], n: 600, bright: 0.9 },
];
// Rest of the global conveyor (Indo-Pacific), dimmer context so the far side of the globe is not empty
const GLOBAL = { name: 'global', n: 520, bright: 0.5, wps: [
  [-60, 60, 1, 0, 0.6], [-61, 100, 1, 0, 0.6], [-60, 140, 1, 0, 0.6], [-52, 168, 1, 0, 0.6],
  [-38, -176, 1, 0, 0.6], [-18, -168, 1, 0, 0.6], [2, -165, 1, 0, 0.6], [20, -168, 1, 0, 0.6],
  [36, -172, 1, 0.05, 0.6], [44, -168, 0.6, 0.25, 0.6], [44, -178, 0.15, 0.45, 0.7], // North Pacific upwelling
  [38, 165, 0, 0.6, 0.9], [28, 152, 0, 0.72, 1.0], [17, 138, 0, 0.85, 1.0], [7, 128, 0, 0.95, 1.0],
  [-2, 121.5, 0, 1, 1.1], [-9, 114, 0, 1, 1.1],                           // Indonesian Throughflow
  [-13, 98, 0, 1, 1.0], [-17, 80, 0, 0.95, 1.0], [-22, 62, 0, 0.9, 1.0], [-30, 46, 0, 0.85, 1.1],
  [-36, 31, 0, 0.8, 1.3],                                                    // Agulhas Current
  [-41, 23, 0, 0.72, 1.1], [-47, 30, 0.4, 0.4, 0.8], [-55, 42, 0.9, 0.1, 0.6],
] };
// Antarctic Circumpolar Current: context ring, flows east all the way round
const ACC = { name: 'acc', wps: [], n: 420, bright: 0.26 };
for (let i = 0; i < 30; i++) {
  const lon = -180 + i * 12;
  ACC.wps.push([-56 - 3.5 * Math.sin(lon * D2R * 2 + 0.7) - 2 * Math.sin(lon * D2R * 5), lon, 0, 0.12, 1.0]);
}

const TABLE = 4096, LANES = 3, TRAIL = 7;

function catmull(p0, p1, p2, p3, t) { // centripetal Catmull–Rom
  const tj = (a, b) => Math.pow(Math.max(vlen(vsub(b, a)), 1e-6), 0.5);
  const t0 = 0, t1 = t0 + tj(p0, p1), t2 = t1 + tj(p1, p2), t3 = t2 + tj(p2, p3);
  const tt = lerp(t1, t2, t);
  const A1 = vadd(vmul(p0, (t1 - tt) / (t1 - t0)), vmul(p1, (tt - t0) / (t1 - t0)));
  const A2 = vadd(vmul(p1, (t2 - tt) / (t2 - t1)), vmul(p2, (tt - t1) / (t2 - t1)));
  const A3 = vadd(vmul(p2, (t3 - tt) / (t3 - t2)), vmul(p3, (tt - t2) / (t3 - t2)));
  const B1 = vadd(vmul(A1, (t2 - tt) / (t2 - t0)), vmul(A2, (tt - t0) / (t2 - t0)));
  const B2 = vadd(vmul(A2, (t3 - tt) / (t3 - t1)), vmul(A3, (tt - t1) / (t3 - t1)));
  return vadd(vmul(B1, (t2 - tt) / (t2 - t1)), vmul(B2, (tt - t1) / (t2 - t1)));
}

function buildPath(def) {
  const W = def.wps, n = W.length;
  const P = W.map(w => vmul(llv(w[0], w[1]), radiusAt(w[2])));
  const raw = []; // dense samples along the closed loop
  const keys = {};
  const SUB = 36;
  for (let i = 0; i < n; i++) {
    const a = W[i], b = W[(i + 1) % n];
    if (a[5]) keys[a[5]] = raw.length;
    for (let s = 0; s < SUB; s++) {
      const u = s / SUB;
      const p = catmull(P[(i - 1 + n) % n], P[i], P[(i + 1) % n], P[(i + 2) % n], u);
      const depth = lerp(a[2], b[2], u);
      const pos = vmul(vnorm(p), radiusAt(depth));
      raw.push({ pos, depth, temp: lerp(a[3], b[3], u), speed: lerp(a[4], b[4], u) });
    }
  }
  // arc length and travel time
  let arc = 0, tau = 0;
  raw[0].arc = 0; raw[0].tau = 0;
  for (let i = 1; i <= raw.length; i++) {
    const r0 = raw[i - 1], r1 = raw[i % raw.length];
    const ds = vlen(vsub(r1.pos, r0.pos));
    arc += ds; tau += ds / ((r0.speed + r1.speed) / 2);
    if (i < raw.length) { r1.arc = arc; r1.tau = tau; }
  }
  const totalArc = arc, totalTau = tau;
  // resample uniformly in travel time
  const tab = { x: new Float32Array(TABLE), y: new Float32Array(TABLE), z: new Float32Array(TABLE),
    temp: new Float32Array(TABLE), depth: new Float32Array(TABLE), arc: new Float32Array(TABLE),
    nx: new Float32Array(TABLE), ny: new Float32Array(TABLE), nz: new Float32Array(TABLE), w: new Float32Array(TABLE) };
  let j = 0;
  for (let k = 0; k < TABLE; k++) {
    const target = k / TABLE * totalTau;
    while (j < raw.length - 1 && raw[j + 1].tau < target) j++;
    const r0 = raw[j], r1 = raw[(j + 1) % raw.length];
    const t1 = j + 1 < raw.length ? r1.tau : totalTau, a1 = j + 1 < raw.length ? r1.arc : totalArc;
    const u = clamp((target - r0.tau) / Math.max(t1 - r0.tau, 1e-9), 0, 1);
    const pos = vadd(vmul(r0.pos, 1 - u), vmul(r1.pos, u));
    tab.x[k] = pos[0]; tab.y[k] = pos[1]; tab.z[k] = pos[2];
    tab.temp[k] = lerp(r0.temp, r1.temp, u);
    tab.depth[k] = lerp(r0.depth, r1.depth, u);
    tab.arc[k] = lerp(r0.arc, a1, u) / totalArc;
    const lat = Math.asin(clamp(pos[1] / vlen(pos), -1, 1)) / D2R;
    // how much this stretch belongs to the overturning (weakens in a slowdown); the Gulf Stream is wind-driven too
    tab.w[k] = Math.max(smooth(38, 52, lat), smooth(0.05, 0.35, tab.depth[k]), def.name === 'acc' || def.name === 'global' ? 0 : 0.35 * smooth(-30, -45, lat));
  }
  for (let k = 0; k < TABLE; k++) { // sideways direction, for lanes
    const a = (k - 2 + TABLE) % TABLE, b = (k + 2) % TABLE;
    const tg = [tab.x[b] - tab.x[a], tab.y[b] - tab.y[a], tab.z[b] - tab.z[a]];
    const up = [tab.x[k], tab.y[k], tab.z[k]];
    const sd = vnorm(vcross(tg, up));
    tab.nx[k] = sd[0]; tab.ny[k] = sd[1]; tab.nz[k] = sd[2];
  }
  const keyArc = {};
  for (const k in keys) keyArc[k] = raw[keys[k]].arc / totalArc;
  return { def, tab, totalTau, keyArc };
}

const PATHS = LOOPS.map(buildPath);
const CONTEXT_PATHS = [buildPath(ACC), buildPath(GLOBAL)];
const FLOW = 0.09; // radians per second at speed 1

// stage 0..4 -> fraction of the path revealed (0 start, 1 sinking, 2 deep, 3 upwelling, 4 whole loop)
function stageArc(path, stage) {
  const k = [0, path.keyArc.sink, path.keyArc.deep, path.keyArc.up, 1];
  if (stage >= 4) return 1.01;
  const i = Math.floor(clamp(stage, 0, 3.999));
  return lerp(k[i], k[i + 1], stage - i);
}

function tempColor(t) {
  // cold deep blue -> pale (cooling) -> warm orange-red
  const cold = [0.06, 0.32, 1.0], mid = [0.95, 0.8, 0.95], warm = [1.0, 0.32, 0.07];

  else o = { viewLat: 22, viewLon: -34, flowTime: t };
  o.viewLat = clamp(o.viewLat + dragLat, -80, 80);
  o.viewLon += dragLon;
  if (spin) o.spinDeg = t * 72;
  if (capEl.textContent !== cap) capEl.textContent = cap;
  render(o);
  requestAnimationFrame(loop);
}

loadEarth().then(() => {
  window.holoReady = true;
  if (!headless) requestAnimationFrame(loop);
});
</script>
</body>
